<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AnyPass 出品チケット監視 - 設定</title>
<style>
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    width: 300px;
    padding: 16px;
    color: #222;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 12px;
  }
  label {
    display: block;
    font-size: 12px;
    margin-top: 10px;
    margin-bottom: 4px;
    color: #555;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
  }
  .hint {
    font-size: 11px;
    color: #888;
    margin-top: 2px;
  }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 8px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  #status {
    margin-top: 8px;
    font-size: 12px;
    color: #16a34a;
    min-height: 14px;
  }
</style>
</head>
<body>
  <h1>AnyPass 出品チケット監視 設定</h1>

  <label for="free_word">検索フリーワード (free_word)</label>
  <input type="text" id="free_word" placeholder="例: アーティスト名・公演名など">

  <label for="p_date">公演日 (p_date)</label>
  <input type="text" id="p_date" placeholder="例: 2026/09/01">
  <div class="hint">一覧に表示される公演日の表記に合わせて入力してください</div>

  <label for="num_of_ticket">購入枚数 (num_of_ticket)</label>
  <input type="number" id="num_of_ticket" min="1" placeholder="例: 2">

  <label for="reload_time">リロード間隔・秒 (reload_time)</label>
  <input type="number" id="reload_time" min="1" placeholder="未指定時は4秒">

  <button id="save">保存</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
